name: Build and publish xcaddy

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: xcaddy-publish
  cancel-in-progress: false

env:
  CADDY_VERSION: 2.11.7
  CLOUDFLARE_VERSION: v0.2.4
  DOCKERHUB_IMAGE: pplulee/xcaddy

jobs:
  build:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check Docker Hub credentials
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DOCKERHUB_USERNAME" || { echo 'Missing DOCKERHUB_USERNAME secret'; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo 'Missing DOCKERHUB_TOKEN secret'; exit 1; }

      - name: Resolve image tags
        id: images
        shell: bash
        run: |
          set -euo pipefail
          ghcr_image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${CADDY_VERSION}-cf${CLOUDFLARE_VERSION#v}"
          sha="sha-${GITHUB_SHA:0:12}"
          {
            echo "ghcr_image=$ghcr_image"
            echo 'tags<<TAGS'
            for image in "$DOCKERHUB_IMAGE" "$ghcr_image"; do
              printf '%s\n' "$image:latest" "$image:$version" "$image:$sha"
            done
            echo 'TAGS'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          pull: true
          load: true
          push: false
          tags: ${{ steps.images.outputs.tags }}
          build-args: |
            CADDY_VERSION=${{ env.CADDY_VERSION }}
            CLOUDFLARE_VERSION=${{ env.CLOUDFLARE_VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.CADDY_VERSION }}-cf${{ env.CLOUDFLARE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify version, module and new token format
        shell: bash
        run: |
          set -euo pipefail
          image="$DOCKERHUB_IMAGE:sha-${GITHUB_SHA:0:12}"
          docker run --rm --network none "$image" caddy version
          docker run --rm --network none "$image" caddy list-modules | grep -Fx 'dns.providers.cloudflare'
          docker run --rm -i --network none \
            -e CLOUDFLARE_API_TOKEN=cfut_000000000000000000000000000000000000000000000000 \
            "$image" caddy validate --config /dev/stdin --adapter caddyfile <<'CADDYFILE'
          example.invalid {
            tls {
              dns cloudflare {env.CLOUDFLARE_API_TOKEN}
            }
            respond "ok"
          }
          CADDYFILE

      - name: Push verified image to both registries
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.images.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            test -z "$tag" || docker push "$tag"
          done <<< "$IMAGE_TAGS"
          {
            echo '### Published images (linux/amd64)'
            echo '```'
            printf '%s\n' "$IMAGE_TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
